<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1530">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Relic Recon</title>
<style>
:root{--ink:#eaf6ff;--dim:#9dbbd6;--cyan:#6fe3ff;--blue:#2a56b8;--deep:#0b1a3a;--orange:#ffb23f;--line:rgba(160,215,255,.35);--glass:rgba(40,80,150,.38)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:"Segoe UI","Trebuchet MS",Tahoma,sans-serif;
background:radial-gradient(ellipse at 30% 0%,#2f5fc4 0,#16306e 45%,#0a1530 100%) fixed;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
background:linear-gradient(90deg,transparent 0 49%,rgba(111,227,255,.18) 50%,transparent 51%) 0 0/120px 100%,
linear-gradient(0deg,transparent 0 96%,rgba(111,227,255,.12) 97%) 0 0/100% 60px}
main{position:relative;max-width:1180px;margin:0 auto;padding:28px 20px calc(60px + env(safe-area-inset-bottom,0px))}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);text-decoration:none;background:rgba(10,20,50,.55);padding:4px 14px 4px 6px;border-radius:99px;border:1px solid transparent}
.pill:hover,.pill:focus-visible{border-color:var(--cyan);outline:none}
.pill svg{width:22px;height:22px;fill:#fff;filter:drop-shadow(0 0 4px rgba(111,227,255,.8))}
h1{font-size:clamp(34px,6vw,54px);font-weight:600;letter-spacing:.02em;margin:14px 0 8px;text-shadow:0 0 24px rgba(111,227,255,.45)}
.tag{display:inline-block;font-size:13px;color:var(--orange);background:rgba(0,0,0,.45);border:1px solid rgba(255,178,63,.5);border-radius:99px;padding:2px 12px}
.panel{margin-top:26px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(60,110,200,.35),rgba(20,45,100,.45));border-radius:6px 6px 18px 6px;backdrop-filter:blur(4px)}
.banner{background:var(--blue);font-size:19px;font-weight:600;padding:10px 20px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.banner b{color:var(--orange)}
.banner button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:99px;padding:4px 16px;cursor:pointer}
.banner button:hover,.banner button:focus-visible{background:rgba(111,227,255,.25);outline:none}
.slots{display:grid;grid-template-columns:repeat(2,1fr) 0 repeat(2,1fr);gap:14px;padding:22px 20px 8px}
.sep{border-left:2px dotted var(--line)}
.slot{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.tile{width:72px;height:72px;display:grid;place-items:center;color:rgba(200,230,255,.55);opacity:.6;transition:opacity .15s,filter .15s}
.tile.on{opacity:1;color:#fff;filter:drop-shadow(0 0 8px rgba(111,227,255,.9))}
.tile img{width:60px;height:60px;object-fit:contain}
.tile svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sname{font-size:14px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.chip{font:inherit;font-size:13px;color:var(--ink);background:rgba(8,20,55,.5);border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer}
.chip:hover{border-color:var(--cyan)}
.chip:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.chip[aria-pressed=true]{background:var(--orange);border-color:var(--orange);color:#1a1200;font-weight:600}
.subbar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:8px 20px 0;padding:14px 0 12px;border-top:1px dotted var(--line)}
.sublabel{font-size:15px;font-weight:600}
.subbar .chips{width:auto}
.chip.sub[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#00202b}
.shit{color:var(--cyan);font-weight:700;text-shadow:0 0 8px rgba(111,227,255,.5)}
.score{font-size:12px;font-weight:600;color:var(--cyan);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.hint{padding:0 20px 18px;font-size:13px;color:var(--dim);text-align:center}
.res{margin-top:26px}
.res h2{font-size:20px;font-weight:600;margin:0 0 14px}
.res h2 b{color:var(--orange)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--glass);border-radius:4px 14px 4px 4px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:18px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.card dt{color:var(--dim)}
.card dd{margin:0}
.hit{color:var(--orange);font-weight:600}
.sub{margin-top:8px;padding-top:8px;border-top:1px dotted var(--line);font-size:13px;color:var(--dim)}
.empty{padding:30px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:8px}
@media(max-width:820px){.slots{grid-template-columns:repeat(2,1fr)}.sep{display:none}}
</style>
</head>

<main>

<h1>Relic Recon</h1>

</section>

};
const icon=v=>/^(data:|https?:)/.test(v)?`<img src="${v}" alt="">`:`<svg viewBox="0 0 24 24">${v}</svg>`;
const SLOTS=[
 {k:"body",n:"Corpo"},
 {k:"boots",n:"Pés"},
 {k:"sphere",n:"Esfera Planar"},
 {k:"rope",n:"Corda de Conexão"}
];
const ORDER=Object.keys(N);
const EXTRA={boots:["DEF"]}; // opções extras que ainda não têm personagem
const sel={body:new Set(),boots:new Set(),sphere:new Set(),rope:new Set()};
const subSel=new Set();
const $=id=>document.getElementById(id);
const byOrder=(a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b);
const opts=k=>[...new Set([...CH.flatMap(c=>c[k]),...(EXTRA[k]||[])])].sort(byOrder);
const SUBOPTS=[...new Set(CH.flatMap(c=>c.subs))].sort(byOrder);
const chip=(cls,g,v,on)=>`<button class="chip ${cls}" type="button" data-g="${g}" data-v="${v}" aria-pressed="${on}">${N[v]}</button>`;

function renderSlots(){
  $("slots").innerHTML=SLOTS.map((s,i)=>{
    const chips=opts(s.k).map(o=>chip("",s.k,o,sel[s.k].has(o))).join("");
    return (i===2?'<div class="sep"></div>':'')+`<div class="slot"><div class="tile${sel[s.k].size?" on":""}">${icon(ICONS[s.k])}</div><div class="sname">${s.n}</div><div class="chips">${chips}</div></div>`;
  }).join("");
}
function renderSubs(){$("subs").innerHTML=SUBOPTS.map(o=>chip("sub","sub",o,subSel.has(o))).join("")}
function renderResults(){
  const ks=Object.keys(sel);
  const active=ks.filter(k=>sel[k].size).length;
  const list=CH.map((c,i)=>({c,i,score:c.subs.filter(v=>subSel.has(v)).length}))
    .filter(x=>ks.every(k=>!sel[k].size||x.c[k].some(v=>sel[k].has(v))))
    .sort((a,b)=>b.score-a.score||a.i-b.i);
  const ord=subSel.size?" · ordenados pelos substats":"";
  $("count").innerHTML=(active?`<b>${list.length}</b> ${list.length===1?"personagem compatível":"personagens compatíveis"}`:`Todos os personagens (<b>${list.length}</b>)`)+ord;
  const fmt=(c,k)=>c[k].map(v=>sel[k].has(v)?`<span class="hit">${N[v]}</span>`:N[v]).join(", ");
  $("grid").innerHTML=list.length?list.map(({c,score})=>`<article class="card"><h3><span>${c.name}</span>${subSel.size?`<span class="score" title="Substats batendo">${score}/${subSel.size}</span>`:""}</h3><dl>
    <dt>Corpo</dt><dd>${fmt(c,"body")}</dd><dt>Pés</dt><dd>${fmt(c,"boots")}</dd>
    <dt>Esfera</dt><dd>${fmt(c,"sphere")}</dd><dt>Corda</dt><dd>${fmt(c,"rope")}</dd></dl>
    <div class="sub">Substats: ${c.subs.map(v=>subSel.has(v)?`<span class="shit">${N[v]}</span>`:N[v]).join(", ")}</div></article>`).join("")
    :'<div class="empty">Nenhum personagem usa essa combinação. Tente desmarcar algum stat.</div>';
}
function update(){renderSlots();renderSubs();renderResults()}
$("panel").addEventListener("click",e=>{
  const b=e.target.closest(".chip[data-g]");if(!b)return;
  const{g,v}=b.dataset;const set=g==="sub"?subSel:sel[g];
  set.has(v)?set.delete(v):set.add(v);
  update();
  const again=document.querySelector(`.chip[data-g="${g}"][data-v="${v}"]`);if(again)again.focus();
});
$("clear").onclick=()=>{Object.values(sel).forEach(x=>x.clear());subSel.clear();update()};
update();

/* Telegram Mini App: funciona normal no navegador se o Telegram não estiver presente */
(function(){
  const tg=window.Telegram&&Telegram.WebApp;
  if(!tg||!tg.initData)return;
  try{tg.ready();tg.expand();tg.setHeaderColor("#0a1530");tg.setBackgroundColor("#0a1530")}catch(e){}
  $("tglink").addEventListener("click",e=>{e.preventDefault();tg.openTelegramLink("https://t.me/StarRailBR")});
})();
</script>
